<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>🔍 Kiểm tra công nhân sự</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
    <h1>📋 Kiểm tra công theo ca</h1>

    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".xlsx" required>
        <input type="submit" value="Tải lên và xử lý">
    </form>

    {% if tables %}
    <div class="result-box">
        <h2>Kết quả phân ca</h2>

        <form method="get" style="margin-bottom: 20px;">
            <input type="text" name="msnv" placeholder="MSNV" value="{{ request.args.get('msnv', '') }}">
            <input type="text" name="name" placeholder="Họ tên" value="{{ request.args.get('name', '') }}">
            <input type="date" name="start_date" value="{{ request.args.get('start_date', '') }}">
            <input type="date" name="end_date" value="{{ request.args.get('end_date', '') }}">
            <input type="submit" value="Lọc dữ liệu">
        </form>

        <!-- Nút download Excel -->
        <form method="get" action="/download" style="margin-bottom: 20px;">
            <input type="submit" value="📥 Tải kết quả Excel">
        </form>

        {{ tables[0]|safe }}
    </div>
    {% endif %}

</body>
</html>
